name: code_editor
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any       

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  path: ^1.9.0
  file_picker: ^8.1.7
  provider: ^6.1.2
  re_editor:
    path: packages/re_editor
  re_highlight: ^0.0.3
  permission_handler: ^13.0.2
  path_provider: ^2.1.5
  archive: ^3.6.1
  # 内置副本：上游 4.0.0 的 IndexAwareCircularBuffer.trimStart() 会破坏行索引不变式，
  # 导致 shell 的 clear / Ctrl+L（ESC[3J）之后终端框选失效。补丁说明见 packages/xterm/PATCHES.md
  xterm:
    path: packages/xterm
  flutter_pty: ^0.4.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:

  generate: true

  uses-material-design: true

  assets:
    - assets/distros/
    - assets/certs/
    - assets/gradle/
    - assets/shims/x86_64/
    - assets/shims/arm64-v8a/
    - assets/icons/distros/

  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-BoldItalic.ttf
          weight: 700
          style: italic

    - family: Fira Code
      fonts:
        - asset: assets/fonts/FiraCodeNerdFontMono-Regular.ttf
        - asset: assets/fonts/FiraCodeNerdFontMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/FiraCodeNerdFontMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121214"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"